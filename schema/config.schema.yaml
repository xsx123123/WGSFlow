$schema: "http://json-schema.org/draft-07/schema#"
title: "WGSFlow Main Configuration Schema"
description: "Schema for validating the main WGSFlow pipeline configuration file (config.yaml)"
type: "object"
properties:
  project_name:
    type: "string"
    description: "Name of the project"
    minLength: 1
  Genome_Version:
    type: "string"
    description: "Genome version to use for analysis"
    enum: ["Lsat_Salinas_v8", "Lsat_Salinas_v11", "ITAG4.1", "TAIR10.1", "GRCm39", "hg38_p14"]
  species:
    type: "string"
    description: "Species name"
    minLength: 1
  client:
    type: "string"
    description: "Client information"
    minLength: 1
  raw_data_path:
    type: "array"
    description: "Paths to raw data directories"
    items:
      type: "string"
    minItems: 1
  sample_csv:
    type: "string"
    description: "Path to sample CSV file"
    minLength: 1
  paired_csv:
    type: "string"
    description: "Path to paired samples CSV file (for somatic analysis)"
    minLength: 1
  workflow:
    type: "string"
    description: "Path to workflow directory"
    minLength: 1
  data_deliver:
    type: "string"
    description: "Path to data delivery directory"
    minLength: 1
  execution_mode:
    type: "string"
    description: "Execution mode for the pipeline"
    enum: ["local", "cluster"]
    default: "local"
  queue_id:
    type: "string"
    description: "Queue ID for cluster execution"
    minLength: 1
  only_qc:
    type: "boolean"
    description: "Whether to run only QC analysis"
    default: false
  library_type:
    type: "string"
    description: "Library type (WGS or WES)"
    enum: ["WGS", "WES"]
    default: "WGS"
  target_bed:
    type: "string"
    description: "Target capture regions BED file (for WES only)"
    minLength: 1
  analysis_type:
    type: "string"
    description: "Analysis type (germline or somatic)"
    enum: ["germline", "somatic"]
    default: "germline"
  whether_paired_group:
    type: "boolean"
    description: "Whether using tumor-normal paired analysis (for somatic only)"
    default: false
  germline_call_variant_type:
    type: "array"
    description: "Germline variant calling methods to use"
    items:
      type: "string"
      enum: ["joint_call_variant", "gatk_single_call_variant", "bcftools_single_call_variant"]
    minItems: 1
  call_SV:
    type: "boolean"
    description: "Whether to call structural variants (SV) using Manta"
    default: false
additionalProperties: true
